# Canonical entry for control.chitanda.net only; access checks precede upstream redirect.
location = / {
    allow 123.119.187.76;
    allow 127.0.0.1;
    allow ::1;
    deny all;
    proxy_pass http://127.0.0.1:5092/tunnel;
    proxy_set_header X-Real-IP $remote_addr;
    set $ct_panel_host $http_host;
    if ($ct_panel_host = "") { set $ct_panel_host $host; }
    proxy_set_header Host $ct_panel_host;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
}
