# Load in Nginx HTTP context, after the private datahub-access.conf identity maps.
# Keys use the verified client identity, never a caller-provided forwarding header.
limit_req_zone $datahub_client_ip zone=datahub_control_rate:10m rate=10r/s;
limit_req_zone $datahub_client_ip zone=datahub_node_rate:10m rate=20r/s;
limit_req_zone $datahub_client_ip zone=datahub_login_rate:1m rate=1r/s;
limit_conn_zone $datahub_client_ip zone=datahub_connections:10m;
