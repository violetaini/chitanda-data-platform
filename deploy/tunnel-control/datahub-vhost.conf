# Mainland origin, behind the existing local TLS/PROXY-protocol stream listener.
# Requires datahub-access.conf in HTTP context and a no-cache ESA host rule.
server {
    listen 80;
    server_name datahub.chitanda.net;
    if ($datahub_admin_allowed = 0) { return 403; }
    return 308 https://datahub.chitanda.net$request_uri;
}
server {
    listen 127.0.0.2:443 ssl proxy_protocol;
    listen 443 quic;
    http2 on;
    http3 on;
    server_name datahub.chitanda.net;
    ssl_certificate /www/server/panel/vhost/cert/datahub.chitanda.net/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/datahub.chitanda.net/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    client_max_body_size 3m;
    add_header Cache-Control "no-store" always;
    add_header CDN-Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    access_log /www/wwwlogs/datahub.chitanda.net.log datahub_access;
    error_log /www/wwwlogs/datahub.chitanda.net.error.log;

    location = / {
        if ($datahub_admin_allowed = 0) { return 403; }
        proxy_pass http://127.0.0.1:5092/tunnel;
        proxy_set_header Host datahub.chitanda.net;
        proxy_set_header X-Real-IP $datahub_client_ip;
    }
    location = /tunnel {
        if ($datahub_admin_allowed = 0) { return 403; }
        proxy_pass http://127.0.0.1:5092;
        proxy_set_header Host datahub.chitanda.net;
        proxy_set_header X-Real-IP $datahub_client_ip;
    }
    location ^~ /tunnel/ {
        if ($datahub_admin_allowed = 0) { return 403; }
        proxy_pass http://127.0.0.1:5092;
        proxy_http_version 1.1;
        proxy_set_header Host datahub.chitanda.net;
        proxy_set_header X-Real-IP $datahub_client_ip;
        proxy_set_header X-Forwarded-For $datahub_client_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_cache_bypass 1;
        proxy_no_cache 1;
        add_header Cache-Control "private, no-store, max-age=0" always;
    }
    location = /transit-node/sync {
        limit_except POST { deny all; }
        client_max_body_size 128k;
        proxy_pass http://127.0.0.1:5092;
        proxy_http_version 1.1;
        proxy_set_header Host datahub.chitanda.net;
        proxy_set_header X-Real-IP $datahub_client_ip;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
    }
    # Public installer contains no credentials. Other lifecycle endpoints use
    # a short-lived enrollment lease or the existing per-node identity.
    location = /install.sh {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:5092;
        proxy_set_header Host datahub.chitanda.net;
        proxy_set_header X-Real-IP $datahub_client_ip;
    }
    location = /transit-node/install.sh {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:5092;
        proxy_set_header Host datahub.chitanda.net;
        proxy_set_header X-Real-IP $datahub_client_ip;
    }
    location = /transit-node/enroll {
        limit_except POST { deny all; }
        client_max_body_size 4k;
        proxy_pass http://127.0.0.1:5092;
        proxy_set_header Host datahub.chitanda.net;
        proxy_set_header X-Real-IP $datahub_client_ip;
    }
    location = /transit-node/uninstalled {
        limit_except POST { deny all; }
        client_max_body_size 512;
        proxy_pass http://127.0.0.1:5092;
        proxy_set_header Host datahub.chitanda.net;
        proxy_set_header X-Real-IP $datahub_client_ip;
    }
    location ~ ^/transit-node/(release|status|releases/linux-(amd64|arm64))$ {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:5092;
        proxy_set_header Host datahub.chitanda.net;
        proxy_set_header X-Real-IP $datahub_client_ip;
        proxy_read_timeout 60s;
    }
    location / { return 404; }
}
