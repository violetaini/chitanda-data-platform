# Included ONLY in the mainland IP virtual host. Install before starting the panel.
# The inherited real_ip_header proxy_protocol trusts only the local stream listener.
location = /tunnel {
    allow 123.119.187.76;
    allow 127.0.0.1;
    allow ::1;
    deny all;
    proxy_pass http://127.0.0.1:5092;
    proxy_set_header X-Real-IP $remote_addr;
    set $ct_panel_host $http_host;
    if ($ct_panel_host = "") { set $ct_panel_host $host; }
    proxy_set_header Host $ct_panel_host;
}
location ^~ /tunnel/ {
    allow 123.119.187.76;
    allow 127.0.0.1;
    allow ::1;
    deny all;
    client_max_body_size 3m;
    proxy_pass http://127.0.0.1:5092;
    proxy_http_version 1.1;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    set $ct_panel_host $http_host;
    if ($ct_panel_host = "") { set $ct_panel_host $host; }
    proxy_set_header Host $ct_panel_host;
    proxy_buffering off;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
}
# Node enrollment/heartbeat is separate from the IP-restricted panel. A new server
# authenticates with its generated node credential before its address is learned.
location = /transit-node/sync {
    limit_except POST { deny all; }
    client_max_body_size 128k;
    proxy_pass http://127.0.0.1:5092;
    proxy_http_version 1.1;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Host $host;
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;
    add_header Cache-Control "no-store" always;
}
